name: Build and release Sahl PDF
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: write
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.14.3"
      - name: Test
        run: |
          set -o pipefail
          gradle testDebugUnitTest --no-daemon 2>&1 | tee test.log || {
            grep -E "^e: |error:|What went wrong|FAILED|Exception|Error:" -A2 test.log | head -40 | while IFS= read -r l; do echo "::error::$l"; done
            exit 1; }
      - name: Build (signed with the Sahl key when KEYSTORE_B64 is set)
        env:
          KEYSTORE_B64: ${{ secrets.KEYSTORE_B64 }}
          KEYSTORE_PASS: ${{ secrets.KEYSTORE_PASS }}
        run: |
          set -o pipefail
          if [ -n "$KEYSTORE_B64" ]; then
            echo "$KEYSTORE_B64" | base64 -d > "$RUNNER_TEMP/release.keystore"
            export KEYSTORE_FILE="$RUNNER_TEMP/release.keystore"
            echo "SIGNED=1" >> "$GITHUB_ENV"
          else
            echo "::warning::KEYSTORE_B64 is not set: building with the debug key (not publishable)."
          fi
          gradle assembleRelease --no-daemon 2>&1 | tee build.log || {
            grep -E "^e: |error:|What went wrong|Error:" -A2 build.log | head -40 | while IFS= read -r l; do echo "::error::$l"; done
            exit 1; }
          rm -f "$RUNNER_TEMP/release.keystore"
          mkdir -p out
          d=app/build/outputs/apk/release
          ls -la "$d"
          cp "$d"/app-universal-release.apk out/SahlPDF.apk
          for abi in armeabi-v7a arm64-v8a x86 x86_64; do cp "$d"/app-$abi-release.apk out/SahlPDF-$abi.apk; done
      - name: Updater metadata
        env:
          MSG: ${{ github.event.head_commit.message || github.event.pull_request.title }}
        run: |
          AAPT="$ANDROID_HOME/build-tools/$(ls "$ANDROID_HOME/build-tools" | sort -V | tail -1)/aapt"
          NOTES=$(printf '%s\n' "$MSG" | head -n 1)
          python3 tools/release_manifest.py --directory out --aapt "$AAPT" --notes "$NOTES"
          (cd out && sha256sum *.apk > SHA256SUMS)
      - uses: actions/upload-artifact@v4
        with:
          name: SahlPDF
          path: out/*
      - name: Publish release
        if: env.SIGNED == '1' && github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          VERSION=$(python3 -c "import json;print(json.load(open('out/version.json'))['sahlpdf'])")
          TAG="build-$GITHUB_RUN_NUMBER"
          NOTES="Sahl PDF $VERSION. Phones: SahlPDF-arm64-v8a.apk. Mi TV / older devices: SahlPDF-armeabi-v7a.apk. Not sure: SahlPDF.apk (universal)."
          gh release create "$TAG" out/*.apk out/version.json out/SHA256SUMS --target "$GITHUB_SHA" \
            --title "Sahl PDF $VERSION" --notes "$NOTES" --latest
          # Stable download links: .../releases/download/latest/SahlPDF.apk
          if gh release view latest >/dev/null 2>&1; then
            gh release upload latest out/*.apk out/version.json out/SHA256SUMS --clobber
            gh release edit latest --latest=false --title "Sahl PDF $VERSION (latest = $TAG)" --notes "$NOTES"
          else
            gh release create latest out/*.apk out/version.json out/SHA256SUMS --target "$GITHUB_SHA" \
              --title "Sahl PDF $VERSION (latest = $TAG)" --notes "$NOTES" --latest=false
          fi
          gh release edit "$TAG" --latest
