name: Build Sahl PDF
on:
  push:
  workflow_dispatch:
permissions:
  contents: write
jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with: { distribution: temurin, java-version: 17 }
      - uses: actions/setup-python@v5
        with: { python-version: "3.12" }
      - name: Android SDK pieces
        run: |
          yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --licenses > /dev/null || true
          "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" "platforms;android-36" "build-tools;36.0.0" > /dev/null
          echo "sdk.dir=$ANDROID_HOME" > local.properties
      - name: Native libraries (PDFium prebuilt for now, then the JNI bridge)
        run: |
          pip install requests
          ANDROID_NDK="$ANDROID_NDK_LATEST_HOME" python3 build_dependencies.py --pdfium prebuilt --abi all
      - name: Build (signed release with the Sahl key when the secrets are set, otherwise a test build)
        env:
          KEYSTORE_B64: ${{ secrets.SIGNING_KEYSTORE_BASE64 }}
          SIGNING_STORE_PASSWORD: ${{ secrets.SIGNING_STORE_PASSWORD }}
          SIGNING_KEY_ALIAS: ${{ secrets.SIGNING_KEY_ALIAS }}
          SIGNING_KEY_PASSWORD: ${{ secrets.SIGNING_KEY_PASSWORD }}
        run: |
          chmod +x gradlew
          mkdir -p out
          if [ -n "$KEYSTORE_B64" ]; then
            echo "$KEYSTORE_B64" | base64 -d > "$RUNNER_TEMP/release.jks"
            export SIGNING_KEYSTORE_PATH="$RUNNER_TEMP/release.jks"
            ./gradlew :app:assembleRelease --no-daemon
            rm -f "$RUNNER_TEMP/release.jks"
            ls -la app/build/outputs/apk/release/
            cp app/build/outputs/apk/release/*universal*.apk out/SahlPDF.apk
            cp app/build/outputs/apk/release/*armeabi-v7a*.apk out/SahlPDF-armeabi-v7a.apk || true
            cp app/build/outputs/apk/release/*arm64-v8a*.apk out/SahlPDF-arm64-v8a.apk || true
            echo "SIGNED=1" >> $GITHUB_ENV
          else
            echo "::warning::Signing secrets are not set in this repository yet: building a TEST version (debug key). Add the 4 SIGNING_* secrets to get the real release."
            ./gradlew :app:assembleDebug --no-daemon
            cp app/build/outputs/apk/debug/*.apk out/SahlPDF-test.apk
          fi
          ls -la out
      - uses: actions/upload-artifact@v4
        with:
          name: SahlPDF
          path: out/*.apk
      - name: Publish as the "latest" release
        if: env.SIGNED == '1'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          # version.json: what Sahl TV reads for "Check for updates"
          python3 -c "import json,os,subprocess; json.dump({'code': 1000+int(os.environ['GITHUB_RUN_NUMBER']), 'sahlpdf': '1.0', 'notes': subprocess.run(['git','log','-1','--format=%s'],capture_output=True,text=True).stdout.strip()}, open('out/version.json','w'))"
          cat out/version.json
          gh release delete latest --yes --cleanup-tag || true
          gh release create latest out/*.apk out/version.json --title "Sahl PDF (latest build)" \
            --notes "Build ${GITHUB_RUN_NUMBER} (${GITHUB_SHA::7}). For the Mi TV use SahlPDF-armeabi-v7a.apk (smaller) or SahlPDF.apk (works everywhere). Based on MJ PDF by Mudlej (GPLv3)."
