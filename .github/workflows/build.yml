name: Build Sahl PDF
on:
  push:
    branches: [main]
    paths: &apk-inputs
      - 'app/**'
      - 'AndroidPdfViewer/**'
      - 'PdfiumAndroid/**'
      - 'build_dependencies/**'
      - 'gradle/**'
      - '*.gradle'
      - 'gradle.properties'
      - 'gradlew*'
      - 'build_dependencies.py'
      - 'build_dictionary.py'
      - '.github/workflows/build.yml'
      - '!**/src/test/**'
      - '!**/src/androidTest/**'
      - '!**/README.md'
  pull_request:
    paths: *apk-inputs
  workflow_dispatch:
permissions:
  contents: write
jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 330
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Test and check release versions
        env:
          EVENT: ${{ github.event_name }}
          PR_BASE: ${{ github.event.pull_request.base.sha }}
          PUSH_BASE: ${{ github.event.before }}
        run: |
          python3 -m unittest discover -s tools -p 'test_versions.py'
          if [ "$EVENT" = pull_request ]; then
            python3 tools/check_versions.py --base "$PR_BASE"
          elif [ "$EVENT" = push ]; then
            python3 tools/check_versions.py --base "$PUSH_BASE"
          else
            python3 tools/check_versions.py
          fi
      - uses: actions/setup-java@v4
        with: { distribution: temurin, java-version: 17 }
      - uses: actions/setup-python@v5
        with: { python-version: "3.12" }
      - name: Android SDK pieces
        run: |
          yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --licenses > /dev/null || true
          "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" "platforms;android-36" "build-tools;36.0.0" > /dev/null
          echo "sdk.dir=$ANDROID_HOME" > local.properties
      - name: Native libraries cache (PDFium built from source with the Arabic fixes)
        id: native
        uses: actions/cache/restore@v4
        with:
          path: |
            PdfiumAndroid/src/main/jni/lib
            PdfiumAndroid/src/main/libs
          key: native-src-v1-${{ hashFiles('build_dependencies/**', 'build_dependencies.py', 'PdfiumAndroid/src/main/jni/**/*.c*', 'PdfiumAndroid/src/main/jni/**/*.h', 'PdfiumAndroid/src/main/jni/**/*.mk', 'PdfiumAndroid/src/main/jni/**/CMakeLists.txt') }}
      - name: Make room on the disk (the PDFium source is big)
        if: steps.native.outputs.cache-hit != 'true'
        run: |
          sudo rm -rf /usr/share/dotnet /usr/local/lib/node_modules /opt/ghc /usr/local/.ghcup /usr/local/share/boost /opt/hostedtoolcache/CodeQL || true
          df -h .
      - name: Build PDFium from source (MJ PDF's patched engine, first time only)
        id: fromsource
        if: steps.native.outputs.cache-hit != 'true'
        continue-on-error: true
        timeout-minutes: 240
        run: |
          pip install requests
          ANDROID_NDK="$ANDROID_NDK_LATEST_HOME" python3 build_dependencies.py --abi all
          echo "ENGINE=source" >> $GITHUB_ENV
      - name: Save the engine for the next builds
        if: steps.native.outputs.cache-hit != 'true' && steps.fromsource.outcome == 'success'
        uses: actions/cache/save@v4
        with:
          path: |
            PdfiumAndroid/src/main/jni/lib
            PdfiumAndroid/src/main/libs
          key: ${{ steps.native.outputs.cache-primary-key }}
      - name: Fallback - ready-made PDFium (without the Arabic fixes)
        if: steps.native.outputs.cache-hit != 'true' && steps.fromsource.outcome != 'success'
        run: |
          echo "::warning::PDFium source build failed, using the prebuilt engine for this build."
          pip install requests
          rm -rf PdfiumAndroid/src/main/jni/lib PdfiumAndroid/src/main/libs
          ANDROID_NDK="$ANDROID_NDK_LATEST_HOME" python3 build_dependencies.py --pdfium prebuilt --abi all
          echo "ENGINE=prebuilt" >> $GITHUB_ENV
      - name: Engine in use
        run: |
          [ "${{ steps.native.outputs.cache-hit }}" = "true" ] && echo "ENGINE=source" >> $GITHUB_ENV || true
          find PdfiumAndroid/src/main -name "*.so" | sort
      - name: Build (signed release with the Sahl key when the secrets are set, otherwise a test build)
        env:
          KEYSTORE_B64: ${{ secrets.SIGNING_KEYSTORE_BASE64 }}
          SIGNING_STORE_PASSWORD: ${{ secrets.SIGNING_STORE_PASSWORD }}
          SIGNING_KEY_ALIAS: ${{ secrets.SIGNING_KEY_ALIAS }}
          SIGNING_KEY_PASSWORD: ${{ secrets.SIGNING_KEY_PASSWORD }}
        run: |
          chmod +x gradlew
          mkdir -p out
          if [ -n "$KEYSTORE_B64" ]; then
            echo "$KEYSTORE_B64" | base64 -d > "$RUNNER_TEMP/release.jks"
            export SIGNING_KEYSTORE_PATH="$RUNNER_TEMP/release.jks"
            ./gradlew :app:assembleRelease --no-daemon
            rm -f "$RUNNER_TEMP/release.jks"
            ls -la app/build/outputs/apk/release/
            cp app/build/outputs/apk/release/*universal*.apk out/SahlPDF.apk
            cp app/build/outputs/apk/release/*armeabi-v7a*.apk out/SahlPDF-armeabi-v7a.apk || true
            cp app/build/outputs/apk/release/*arm64-v8a*.apk out/SahlPDF-arm64-v8a.apk || true
            echo "SIGNED=1" >> $GITHUB_ENV
          else
            echo "::warning::Signing secrets are not set in this repository yet: building a TEST version (debug key). Add the 4 SIGNING_* secrets to get the real release."
            ./gradlew :app:assembleDebug --no-daemon
            cp app/build/outputs/apk/debug/*.apk out/SahlPDF-test.apk
          fi
          ls -la out
      - uses: actions/upload-artifact@v4
        with:
          name: SahlPDF
          path: out/*.apk
      - name: Publish numbered release and update compatible latest downloads
        if: env.SIGNED == '1' && github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          VERSION=$(python3 tools/check_versions.py --print-version)
          export VERSION
          python3 - <<'PY'
          import json, os, subprocess
          json.dump({
              'code': 1000 + int(os.environ['GITHUB_RUN_NUMBER']),
              'sahlpdf': os.environ['VERSION'],
              'engine': os.environ.get('ENGINE', ''),
              'notes': subprocess.check_output(['git', 'log', '-1', '--format=%s'], text=True).strip()
          }, open('out/version.json', 'w'))
          PY
          (cd out && sha256sum *.apk > SHA256SUMS)
          TAG="build-$GITHUB_RUN_NUMBER"
          NOTES="Sahl PDF $VERSION · build $GITHUB_RUN_NUMBER ($GITHUB_SHA). For Mi TV use SahlPDF-armeabi-v7a.apk or the universal SahlPDF.apk. PDF engine: $ENGINE. Based on MJ PDF 3.1.0 by Mudlej (GPLv3)."
          gh release create "$TAG" out/*.apk out/version.json out/SHA256SUMS --target "$GITHUB_SHA" --title "Sahl PDF $VERSION · build $GITHUB_RUN_NUMBER" --notes "$NOTES" --latest=false
          if gh release view latest >/dev/null 2>&1; then
            gh release upload latest out/*.apk out/SHA256SUMS --clobber
            gh release upload latest out/version.json --clobber
            gh release edit latest --latest=false --title "Sahl PDF $VERSION (latest = $TAG)" --notes "$NOTES"
          else
            gh release create latest out/*.apk out/version.json out/SHA256SUMS --target "$GITHUB_SHA" --title "Sahl PDF $VERSION (latest = $TAG)" --notes "$NOTES" --latest=false
          fi
          gh release edit "$TAG" --latest
