name: PDF Tools tests
on:
  pull_request:
    paths:
      - 'app/**'
      - '*.gradle'
      - '.github/workflows/pdf-tools.yml'
  push:
    branches: [main]
    paths:
      - 'app/**'
      - '*.gradle'
      - '.github/workflows/pdf-tools.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  tools:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
      - name: Install compile SDK
        run: |
          yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --licenses > /dev/null || true
          "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" "platforms;android-36" "build-tools;36.0.0"
          echo "sdk.dir=$ANDROID_HOME" > local.properties
      - name: Unit tests and lint
        run: |
          chmod +x gradlew
          ./gradlew :app:testDebugUnitTest --tests '*PageSelectionTest' --tests '*PagePlanTest' --tests '*UpdatePolicyTest' --no-daemon
          if ! ./gradlew :app:lintDebug --no-daemon; then
            python3 -c 'import xml.etree.ElementTree as E; r=E.parse("app/build/reports/lint-results-debug.xml"); [print(E.tostring(i, encoding="unicode")) for i in r.findall("issue") if i.get("severity") in ("Error","Fatal")]'
            exit 1
          fi
      - name: Enable emulator acceleration
        if: ${{ !cancelled() }}
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - name: Exercise real PDF outputs
        if: ${{ !cancelled() }}
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 35
          arch: x86_64
          disable-animations: true
          script: ./gradlew :app:connectedDebugAndroidTest -Pandroid.testInstrumentationRunnerArguments.class=com.gitlab.mudlej.MjPdfReader.ui.tools.PdfToolsEngineTest,com.gitlab.mudlej.MjPdfReader.ui.tools.PageManagerTest,com.gitlab.mudlej.MjPdfReader.update.UpdateRepositoryTest --no-daemon
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: pdf-tools-test-reports
          path: |
            app/build/reports/
            app/build/outputs/androidTest-results/
